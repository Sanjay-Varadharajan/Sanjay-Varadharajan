<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#070012"/>
<stop offset="100%" stop-color="#170028"/>
</linearGradient>
</defs>

<rect width="1600" height="600" fill="url(#bg)"/>

<text x="800"
      y="55"
      text-anchor="middle"
      fill="#ff00ff"
      font-size="34"
      font-family="monospace"
      font-weight="bold">

ACTIVITY RADAR · FOCUS AREAS

</text>

<!-- Radar -->

<g stroke="#ff00ff" fill="none" opacity="0.4">
<circle cx="800" cy="320" r="60"/>
<circle cx="800" cy="320" r="120"/>
<circle cx="800" cy="320" r="180"/>
<circle cx="800" cy="320" r="240"/>
</g>

<g stroke="#00ffff" opacity="0.4">
<line x1="800" y1="80" x2="800" y2="560"/>
<line x1="560" y1="320" x2="1040" y2="320"/>
<line x1="630" y1="150" x2="970" y2="490"/>
<line x1="970" y1="150" x2="630" y2="490"/>
</g>

<!-- Animated Pulse -->

<circle cx="800"
        cy="320"
        r="12"
        fill="#00ff88">

<animate attributeName="r"
values="12;18;12"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<!-- Radar Shape -->

<polygon
points="
800,90
1010,210
980,420
800,520
620,420
590,210"
fill="#ff00ff22"
stroke="#ff00ff"
stroke-width="3">

<animate attributeName="opacity"
values="0.5;1;0.5"
dur="3s"
repeatCount="indefinite"/>

</polygon>

<!-- BACKEND -->

<circle cx="800" cy="90" r="12" fill="#00ffff">
<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
</circle>

<text x="800"
      y="65"
      text-anchor="middle"
      fill="#00ffff"
      font-size="18"
      font-family="monospace">

BACKEND ENGINEERING

</text>

<!-- SECURITY -->

<circle cx="1010" cy="210" r="12" fill="#ff0040">
<animate attributeName="r" values="12;16;12" dur="1.6s" repeatCount="indefinite"/>
</circle>

<text x="1090"
      y="215"
      fill="#ff0040"
      font-size="18"
      font-family="monospace">

SECURITY

</text>

<!-- CLOUD -->

<circle cx="980" cy="420" r="12" fill="#ffd700">
<animate attributeName="r" values="12;16;12" dur="1.8s" repeatCount="indefinite"/>
</circle>

<text x="1060"
      y="425"
      fill="#ffd700"
      font-size="18"
      font-family="monospace">

CLOUD DEPLOYMENT

</text>

<!-- SYSTEM DESIGN -->

<circle cx="800" cy="520" r="12" fill="#00ff88">
<animate attributeName="r" values="12;16;12" dur="2.2s" repeatCount="indefinite"/>
</circle>

<text x="800"
      y="555"
      text-anchor="middle"
      fill="#00ff88"
      font-size="18"
      font-family="monospace">

SYSTEM DESIGN

</text>

<!-- DATABASE -->

<circle cx="620" cy="420" r="12" fill="#ff66ff">
<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
</circle>

<text x="390"
      y="425"
      fill="#ff66ff"
      font-size="18"
      font-family="monospace">

DATABASE DESIGN

</text>

<!-- AI -->

<circle cx="590" cy="210" r="12" fill="#00ffff">
<animate attributeName="r" values="12;16;12" dur="1.9s" repeatCount="indefinite"/>
</circle>

<text x="380"
      y="215"
      fill="#00ffff"
      font-size="18"
      font-family="monospace">

AI PROJECTS

</text>

<!-- Right-side Tech Stack -->

<g font-family="monospace">

<text x="1200" y="170" fill="#00ffff">JAVA</text>
<rect x="1280" y="158" width="220" height="12" fill="#00ffff"/>

<text x="1200" y="210" fill="#00ff88">SPRING BOOT</text>
<rect x="1280" y="198" width="220" height="12" fill="#00ff88"/>

<text x="1200" y="250" fill="#ffd700">MYSQL</text>
<rect x="1280" y="238" width="220" height="12" fill="#ffd700"/>

<text x="1200" y="290" fill="#ff66ff">REDIS</text>
<rect x="1280" y="278" width="220" height="12" fill="#ff66ff"/>

<text x="1200" y="330" fill="#ff0040">AWS</text>
<rect x="1280" y="318" width="220" height="12" fill="#ff0040"/>

<text x="1200" y="370" fill="#00ffff">DOCKER</text>
<rect x="1280" y="358" width="220" height="12" fill="#00ffff"/>

<text x="1200" y="410" fill="#00ff88">JWT & RBAC</text>
<rect x="1280" y="398" width="220" height="12" fill="#00ff88"/>

<text x="1200" y="450" fill="#ffd700">REST APIs</text>
<rect x="1280" y="438" width="220" height="12" fill="#ffd700"/>

</g>

<!-- Cyber Cat -->

<g>

<animateTransform
attributeName="transform"
type="translate"
values="0 0;12 0;0 0"
dur="3s"
repeatCount="indefinite"/>

<ellipse cx="180"
         cy="500"
         rx="40"
         ry="20"
         fill="#ff66ff"/>

<circle cx="140"
        cy="485"
        r="15"
        fill="#ff66ff"/>

<polygon points="128,473 136,452 144,473"
fill="#ff66ff"/>

<polygon points="146,473 154,452 162,473"
fill="#ff66ff"/>

<rect x="126"
      y="480"
      width="22"
      height="6"
      fill="#00ffff"/>

</g>

<text x="250"
      y="505"
      fill="#ff66ff"
      font-size="16"
      font-family="monospace">

RADAR CAT MONITORING PROJECTS...

</text>

<text x="800"
      y="590"
      text-anchor="middle"
      fill="#888"
      font-size="12"
      font-family="monospace">

JAVA • SPRING BOOT • MYSQL • REDIS • AWS • DOCKER • SECURITY • AI

</text>

</svg>
