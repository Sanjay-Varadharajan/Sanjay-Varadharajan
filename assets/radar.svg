<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" shape-rendering="geometricPrecision">

  <!-- Background -->
  <rect width="1600" height="700" fill="#0a0014"/>

  <!-- Title -->
  <text x="800" y="80"
        text-anchor="middle"
        fill="#ff00ff"
        font-size="34"
        font-family="monospace, Courier New">
    ACTIVITY RADAR · FOCUS AREAS
  </text>

  <!-- Radar Circles -->
  <g stroke="#ff00ff" stroke-width="1" fill="none">
    <circle cx="800" cy="350" r="80"/>
    <circle cx="800" cy="350" r="160"/>
    <circle cx="800" cy="350" r="240"/>
    <circle cx="800" cy="350" r="300"/>
  </g>

  <!-- Radar Lines -->
  <g stroke="#00ffff" stroke-width="1">
    <line x1="800" y1="80" x2="800" y2="620"/>
    <line x1="520" y1="350" x2="1080" y2="350"/>
    <line x1="610" y1="170" x2="990" y2="530"/>
    <line x1="990" y1="170" x2="610" y2="530"/>
  </g>

  <!-- Data Polygon -->
  <polygon points="800,140 1010,240 960,460 800,560 640,460 590,240"
           fill="#ff00ff22"
           stroke="#ff00ff"
           stroke-width="3"/>

  <!-- Center Labels -->
  <g font-family="monospace, Courier New" font-size="16">

    <text x="800" y="120" text-anchor="middle" fill="#00ffff">BACKEND</text>
    <circle cx="800" cy="140" r="6" fill="#00ffff"/>

    <text x="1080" y="240" fill="#ff4444">SECURITY</text>
    <circle cx="1010" cy="240" r="6" fill="#ff4444"/>

    <text x="1080" y="460" fill="#ffd700">CLOUD</text>
    <circle cx="960" cy="460" r="6" fill="#ffd700"/>

    <text x="800" y="610" text-anchor="middle" fill="#00ff88">SYSTEM DESIGN</text>
    <circle cx="800" cy="560" r="6" fill="#00ff88"/>

    <text x="360" y="460" fill="#ff66ff">DATABASE</text>
    <circle cx="640" cy="460" r="6" fill="#ff66ff"/>

    <text x="330" y="240" fill="#00ffff">AI PROJECTS</text>
    <circle cx="590" cy="240" r="6" fill="#00ffff"/>

  </g>

  <!-- Tech Stack -->
  <g font-family="monospace, Courier New" font-size="18">
    <text x="1180" y="200" fill="#00ffff">JAVA</text>
    <text x="1180" y="240" fill="#00ff88">SPRING BOOT</text>
    <text x="1180" y="280" fill="#ffd700">MYSQL</text>
    <text x="1180" y="320" fill="#ff66ff">REDIS</text>
    <text x="1180" y="360" fill="#ff4444">AWS</text>
    <text x="1180" y="400" fill="#00ffff">DOCKER</text>
    <text x="1180" y="440" fill="#00ff88">JWT / RBAC</text>
    <text x="1180" y="480" fill="#ffd700">REST APIs</text>
  </g>

  <!-- Footer -->
  <text x="800" y="660"
        text-anchor="middle"
        fill="#777"
        font-size="14"
        font-family="monospace">
    JAVA • SPRING BOOT • MYSQL • REDIS • AWS • DOCKER • SECURITY • AI
  </text>

</svg>
