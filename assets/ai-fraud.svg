<svg width="1600" height="550" viewBox="0 0 1600 550" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#070012"/>
<stop offset="100%" stop-color="#170028"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4"/>
</filter>

<filter id="strongGlow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>

<rect width="1600" height="550" fill="url(#bg)"/>

<!-- TITLE -->

<text x="800"
      y="55"
      text-anchor="middle"
      fill="#ff00ff"
      font-size="34"
      font-family="monospace"
      font-weight="bold">

AI EMAIL FRAUD DETECTION CENTER

</text>

<!-- THREAT LEVEL -->

<rect x="80"
      y="100"
      width="320"
      height="160"
      rx="20"
      fill="#100018"
