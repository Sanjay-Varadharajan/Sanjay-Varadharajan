<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#080014"/>
<stop offset="100%" stop-color="#1a0033"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4"/>
</filter>

<filter id="strongGlow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>

<!-- Background -->

<rect width="1600" height="520" fill="url(#bg)"/>

<!-- Title -->

<text x="800"
      y="55"
      text-anchor="middle"
      fill="#ff00ff"
      font-size="34"
      font-family="monospace"
      font-weight="bold">

IAM BACKEND CONTROL ROOM

</text>

<!-- JWT PIPELINE -->

<rect x="140"
      y="120"
      width="1320"
      height="120"
      rx="20"
      fill="#100018"
      stroke="#00ffff"
      stroke-width="3"/>

<text x="800"
      y="155"
      text-anchor="middle"
      fill="#00ffff"
      font-size="24"
      font-family="monospace">

JWT TOKEN PIPELINE

</text>

<!-- TOKEN BLOCKS -->

<rect x="250" y="180" width="120" height="40" rx="8"
fill="#00ffff"/>

<text x="310"
      y="205"
      text-anchor="middle"
      fill="#000"
      font-size="14"
      font-family="monospace">

HEADER

</text>

<rect x="470" y="180" width="120" height="40" rx="8"
fill="#ff00ff"/>

<text x="530"
      y="205"
      text-anchor="middle"
      fill="#fff"
      font-size="14"
      font-family="monospace">

PAYLOAD

</text>

<rect x="690" y="180" width="120" height="40" rx="8"
fill="#00ff88"/>

<text x="750"
      y="205"
      text-anchor="middle"
      fill="#000"
      font-size="14"
      font-family="monospace">

SIGNATURE

</text>

<rect x="1010" y="180" width="180" height="40" rx="8"
fill="#ffd700"/>

<text x="1100"
      y="205"
      text-anchor="middle"
      fill="#000"
      font-size="14"
      font-family="monospace">

RS256 VERIFY

</text>

<!-- PIPELINES -->

<line x1="370" y1="200" x2="470" y2="200"
stroke="#00ffff"
stroke-width="4"/>

<line x1="590" y1="200" x2="690" y2="200"
stroke="#ff00ff"
stroke-width="4"/>

<line x1="810" y1="200" x2="1010" y2="200"
stroke="#00ff88"
stroke-width="4"/>

<!-- FLOWING TOKENS -->

<circle r="8" fill="#ffffff">

<animateMotion
dur="3s"
repeatCount="indefinite"
path="M370 200 L1010 200"/>

</circle>

<circle r="8" fill="#00ffff">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M370 200 L1010 200"/>

</circle>

<circle r="8" fill="#ff00ff">

<animateMotion
dur="5s"
repeatCount="indefinite"
path="M370 200 L1010 200"/>

</circle>

<!-- RBAC SECTION -->

<text x="800"
      y="300"
      text-anchor="middle"
      fill="#ff00ff"
      font-size="26"
      font-family="monospace">

ROLE BASED ACCESS CONTROL

</text>

<!-- ADMIN -->

<rect x="220"
      y="340"
      width="260"
      height="120"
      rx="20"
      fill="#120020"
      stroke="#ff0040"
      stroke-width="3"/>

<text x="350"
      y="385"
      text-anchor="middle"
      fill="#ff0040"
      font-size="28"
      font-family="monospace">

ADMIN

</text>

<text x="350"
      y="420"
      text-anchor="middle"
      fill="#ffffff"
      font-size="13"
      font-family="monospace">

READ • WRITE • DELETE

</text>

<!-- MANAGER -->

<rect x="670"
      y="340"
      width="260"
      height="120"
      rx="20"
      fill="#120020"
      stroke="#ffd700"
      stroke-width="3"/>

<text x="800"
      y="385"
      text-anchor="middle"
      fill="#ffd700"
      font-size="28"
      font-family="monospace">

MANAGER

</text>

<text x="800"
      y="420"
      text-anchor="middle"
      fill="#ffffff"
      font-size="13"
      font-family="monospace">

READ • WRITE

</text>

<!-- USER -->

<rect x="1120"
      y="340"
      width="260"
      height="120"
      rx="20"
      fill="#120020"
      stroke="#00ff88"
      stroke-width="3"/>

<text x="1250"
      y="385"
      text-anchor="middle"
      fill="#00ff88"
      font-size="28"
      font-family="monospace">

USER

</text>

<text x="1250"
      y="420"
      text-anchor="middle"
      fill="#ffffff"
      font-size="13"
      font-family="monospace">

READ ONLY

</text>

<!-- CONNECTIONS -->

<line x1="480"
      y1="400"
      x2="670"
      y2="400"
      stroke="#ff00ff"
      stroke-width="4"/>

<line x1="930"
      y1="400"
      x2="1120"
      y2="400"
      stroke="#00ffff"
      stroke-width="4"/>

<!-- AUTH PACKETS -->

<circle r="7" fill="#ff00ff">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M480 400 L1120 400"/>

</circle>

<circle r="7" fill="#00ffff">

<animateMotion
dur="5s"
repeatCount="indefinite"
path="M480 400 L1120 400"/>

</circle>

<!-- STATUS -->

<circle cx="1450" cy="90" r="10" fill="#00ff88">

<animate attributeName="opacity"
values="1;0.3;1"
dur="1s"
repeatCount="indefinite"/>

</circle>

<text x="1420"
      y="96"
      text-anchor="end"
      fill="#00ff88"
      font-size="14"
      font-family="monospace">

AUTH ONLINE

</text>

<!-- SECURITY CAT -->

<g>

<ellipse cx="120" cy="420"
         rx="30"
         ry="16"
         fill="#ff66ff"/>

<circle cx="88"
        cy="408"
        r="12"
        fill="#ff66ff"/>

<polygon points="80,398 85,382 91,398"
fill="#ff66ff"/>

<polygon points="95,398 101,382 106,398"
fill="#ff66ff"/>

<rect x="79"
      y="405"
      width="18"
      height="4"
      fill="#00ffff"/>

<animateTransform
attributeName="transform"
type="translate"
values="0 0;5 0;0 0"
dur="2s"
repeatCount="indefinite"/>

</g>

<!-- Footer -->

<text x="800"
      y="500"
      text-anchor="middle"
      fill="#888"
      font-size="12"
      font-family="monospace">

JWT • RBAC • RS256 • AUTHORIZATION • AUTHENTICATION

</text>

</svg>
