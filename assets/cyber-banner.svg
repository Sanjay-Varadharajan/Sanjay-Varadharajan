<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#070014"/>
<stop offset="100%" stop-color="#190033"/>
</linearGradient>

</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<text x="800" y="90"
fill="#ff00ff"
font-size="48"
text-anchor="middle"
font-family="monospace"
font-weight="bold">

SANJAY VARADHARAJAN

<animate attributeName="opacity"
values="1;0.6;1"
dur="2s"
repeatCount="indefinite"/>

</text>

<text x="800" y="145"
fill="#00ffff"
font-size="24"
text-anchor="middle"
font-family="monospace">

BACKEND • SECURITY • AI • CLOUD

<animate attributeName="opacity"
values="1;0.4;1"
dur="3s"
repeatCount="indefinite"/>

</text>

<circle cx="800" cy="220" r="85"
stroke="#ff00ff"
stroke-width="3"
fill="none">

<animate attributeName="r"
values="85;92;85"
dur="4s"
repeatCount="indefinite"/>

</circle>

<!-- Cat -->

<ellipse cx="800" cy="350" rx="110" ry="45" fill="#ff66ff"/>

<circle cx="700" cy="340" r="35" fill="#ff66ff"/>

<polygon points="680,320 690,290 705,320" fill="#ff66ff"/>

<polygon points="710,320 725,290 735,320" fill="#ff66ff"/>

<rect x="680" y="336"
width="40"
height="8"
fill="#00ffff">

<animate attributeName="opacity"
values="1;0.2;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<text x="800"
y="470"
fill="#00ff88"
font-size="18"
font-family="monospace"
text-anchor="middle">

SYSTEM STATUS : OPERATIONAL

<animate attributeName="opacity"
values="1;0.5;1"
dur="1.5s"
repeatCount="indefinite"/>

</text>

</svg>
